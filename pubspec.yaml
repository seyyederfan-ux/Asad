name: ccloud_gui
description: "CCloud PRO — a modern Fluent 2 / Acrylic Glass desktop client for the CCloud streaming platform (movies, series, live TV, downloads & subtitles)."
publish_to: 'none'

version: 2.0.0+6

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State management & routing (preserved from the original project)
  provider: ^6.1.2
  go_router: ^14.0.0

  # Networking & persistence (preserved from the original project)
  http: ^1.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Desktop shell & windowing
  window_manager: ^0.3.8
  flutter_acrylic: ^1.1.4
  url_launcher: ^6.3.0
  share_plus: ^9.0.0

  # Media playback (in-app player) & platform helpers
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.7
  ffi: ^2.1.2
  image: ^4.2.0

  # Native desktop file pickers (subtitles & download directory)
  file_picker: ^8.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/CountryFlags/
    - assets/fonts/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
