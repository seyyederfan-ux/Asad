# Codemagic workflow: build CCloud PRO Windows Setup.exe
workflows:
  windows-release:
    name: CCloud PRO Windows Build
    max_build_duration: 60
    instance_type: windows
    environment:
      flutter: 3.35.7
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Build Windows release
        script: flutter build windows --release
      - name: Install Inno Setup
        script: |
          $url = "https://files.jrsoftware.org/is/6/innosetup-6.3.3.exe"
          $installer = "$env:TEMP\innosetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
      - name: Build installer (Inno Setup)
        script: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $iscc "installer\CCloudPro.iss"
      - name: Collect artifacts
        script: |
          New-Item -ItemType Directory -Force -Path "$CM_BUILD_DIR\artifacts" | Out-Null
          Copy-Item "dist\*.exe" "$CM_BUILD_DIR\artifacts\" -ErrorAction SilentlyContinue
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "$CM_BUILD_DIR\artifacts\CCloudPro-2.0.0-Portable.zip" -Force
    artifacts:
      - artifacts/**
